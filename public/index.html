<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OPay Wallet Simulator</title>
  <style>
    :root {
      --green: #00b14f;
      --dark: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 480px; margin: 0 auto; }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .header h1 {
      font-size: 1.8rem;
      color: var(--green);
      margin-bottom: 4px;
    }
    .header p { color: var(--muted); font-size: 0.9rem; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .balance-label { color: var(--muted); font-size: 0.85rem; margin-bottom: 6px; }
    .balance-amount {
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--green);
      letter-spacing: -1px;
    }
    .safe {
      font-size: 0.95rem;
      color: var(--muted);
      margin-top: 8px;
    }
    .badge {
      display: inline-block;
      background: #22c55e33;
      color: #4ade80;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 10px;
    }
    .badge.off { background: #ef444433; color: #f87171; }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }
    button, .btn {
      background: var(--green);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { transform: translateY(-2px); opacity: 0.95; }
    button.secondary { background: #334155; }
    button.danger { background: #ef4444; }
    input, select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 1rem;
      margin-bottom: 12px;
    }
    label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 0.85rem; }
    .log {
      max-height: 280px;
      overflow-y: auto;
      font-size: 0.85rem;
    }
    .log-item {
      padding: 10px 0;
      border-bottom: 1px solid #334155;
    }
    .log-item.success { border-left: 3px solid var(--green); padding-left: 10px; }
    .log-item.fail { border-left: 3px solid #ef4444; padding-left: 10px; }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card);
      padding: 24px;
      border-radius: 16px;
      width: 90%;
      max-width: 400px;
    }
    .status { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>💚 OPay Simulator</h1>
      <p>Local Wallet • Real Feel • Full Audit</p>
    </div>

    <div class="card">
      <div class="balance-label">Available Balance</div>
      <div class="balance-amount" id="balance">₦0.00</div>
      <div class="safe" id="safe">Safe to spend: ₦0.00</div>
      <div id="badge" class="badge">Loading...</div>

      <div class="actions">
        <button onclick="openModal('topup')">+ Top Up</button>
        <button onclick="openModal('transfer')" class="secondary">Transfer</button>
        <button onclick="toggleUnlimited()" id="unlimitedBtn">Unlimited OFF</button>
        <button onclick="loadAudit()" class="secondary">Audit Log</button>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:12px">Recent Activity</h3>
      <div class="log" id="log">Loading...</div>
    </div>

    <div class="status" id="status">Connected to local simulator</div>
  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <h3 id="modalTitle" style="margin-bottom:16px">Action</h3>
      <div id="modalBody"></div>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button onclick="closeModal()" class="secondary" style="flex:1">Cancel</button>
        <button onclick="submitModal()" style="flex:1" id="modalSubmit">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    const API = window.location.origin; // same origin when served by express
    let currentAction = null;

    async function api(method, path, body) {
      const res = await fetch(API + path, {
        method,
        headers: { 'Content-Type': 'application/json', 'X-Actor': 'frontend-ui' },
        body: body ? JSON.stringify(body) : undefined
      });
      return res.json();
    }

    async function refresh() {
      try {
        const r = await api('GET', '/balance');
        if (r.success) {
          document.getElementById('balance').textContent = r.data.availableBalanceFormatted;
          document.getElementById('safe').textContent = 'Safe to spend: ' + r.data.safeToSpendFormatted;
          const badge = document.getElementById('badge');
          const btn = document.getElementById('unlimitedBtn');
          if (r.data.unlimitedMode) {
            badge.textContent = '🔥 UNLIMITED MODE';
            badge.className = 'badge';
            btn.textContent = 'Unlimited ON';
          } else {
            badge.textContent = 'Normal Mode';
            badge.className = 'badge off';
            btn.textContent = 'Unlimited OFF';
          }
        }
        loadLedger();
      } catch (e) {
        document.getElementById('status').textContent = 'Server not running. Start with: npm start';
      }
    }

    async function loadLedger() {
      const r = await api('GET', '/ledger?limit=15');
      const log = document.getElementById('log');
      if (!r.data || r.data.length === 0) {
        log.innerHTML = '<div style="color:#94a3b8">No transactions yet</div>';
        return;
      }
      log.innerHTML = r.data.map(e => `
        <div class="log-item ${e.type === 'credit' || e.type === 'release' ? 'success' : ''}">
          <strong>${e.type.toUpperCase()}</strong> ₦${(e.amount/100).toLocaleString()} 
          <span style="float:right;color:#94a3b8">${new Date(e.timestamp).toLocaleTimeString()}</span><br/>
          <small>${e.meta?.reason || ''} → ₦${(e.afterBalance/100).toLocaleString()}</small>
        </div>
      `).join('');
    }

    async function loadAudit() {
      const r = await api('GET', '/audit?limit=20');
      const log = document.getElementById('log');
      log.innerHTML = r.data.map(e => `
        <div class="log-item ${e.success ? 'success' : 'fail'}">
          <strong>${e.action}</strong> ${e.success ? '✅' : '❌'}
          <span style="float:right;color:#94a3b8">${new Date(e.timestamp).toLocaleTimeString()}</span><br/>
          <small>${e.errorMessage || e.reason || ''} ${e.amount ? '₦'+(e.amount/100).toLocaleString() : ''}</small>
        </div>
      `).join('');
    }

    function openModal(type) {
      currentAction = type;
      const modal = document.getElementById('modal');
      const title = document.getElementById('modalTitle');
      const body = document.getElementById('modalBody');
      modal.classList.add('active');

      if (type === 'topup') {
        title.textContent = 'Top Up Wallet';
        body.innerHTML = `
          <label>Amount (₦)</label>
          <input type="number" id="amount" placeholder="e.g. 5000" min="1" />
          <label>Reason (optional)</label>
          <input type="text" id="reason" placeholder="Salary, gift, etc." />
        `;
      } else if (type === 'transfer') {
        title.textContent = 'Transfer Money';
        body.innerHTML = `
          <label>Amount (₦)</label>
          <input type="number" id="amount" placeholder="e.g. 1000" min="1" />
          <label>Recipient (name or account)</label>
          <input type="text" id="recipient" placeholder="John Doe / 0803..." />
          <label>Reason (optional)</label>
          <input type="text" id="reason" placeholder="Payment for..." />
        `;
      }
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    async function submitModal() {
      const amountNaira = parseFloat(document.getElementById('amount').value) || 0;
      const amount = Math.round(amountNaira * 100); // to kobo
      const reason = document.getElementById('reason')?.value || '';
      const recipient = document.getElementById('recipient')?.value || 'unknown';

      if (amount <= 0) return alert('Enter a valid amount');

      let r;
      if (currentAction === 'topup') {
        r = await api('POST', '/topup', { amount, reason });
      } else {
        r = await api('POST', '/transfer', { amount, reason, recipient });
      }

      if (r.success) {
        alert(r.message);
        closeModal();
        refresh();
      } else {
        alert(r.message || 'Failed');
      }
    }

    async function toggleUnlimited() {
      const badge = document.getElementById('badge');
      const currentlyOn = badge.textContent.includes('UNLIMITED');
      const r = await api('POST', '/unlimited', { enabled: !currentlyOn });
      alert(r.message);
      refresh();
    }

    // Auto refresh every 8s
    refresh();
    setInterval(refresh, 8000);
  </script>
</body>
</html>
